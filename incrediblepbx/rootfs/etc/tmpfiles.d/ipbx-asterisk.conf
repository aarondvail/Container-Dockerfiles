# Incredible PBX's php8.2-fpm override (/etc/systemd/system/php8.2-fpm.service.d/override.conf)
# references /run/asterisk, which normally appears only once Asterisk starts.
# PHP-FPM starts earlier, so without this it fails with 226/NAMESPACE after
# every container restart. Create it at boot, before any service starts.
d /run/asterisk 0775 asterisk asterisk -
