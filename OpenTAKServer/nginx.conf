worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    # inline MIME types, so this doesn't depend on /etc/nginx/mime.types existing
    types {
        text/html               html htm;
        text/css                css;
        application/javascript  js mjs;
        application/json        json map;
        image/svg+xml           svg;
        image/png               png;
        image/jpeg              jpg jpeg;
        image/gif               gif;
        image/webp              webp;
        image/x-icon            ico;
        font/woff               woff;
        font/woff2              woff2;
        font/ttf                ttf;
        application/zip         zip;
    }
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    access_log /dev/stdout;

    include /etc/nginx/conf.d/*.conf;
}
