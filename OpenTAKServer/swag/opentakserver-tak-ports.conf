## SWAG site-conf: /config/nginx/site-confs/opentakserver-tak-ports.conf
## TAK client ports. These use OTS's OWN CA and server cert (not Let's Encrypt),
## because ATAK/iTAK trust the OTS CA from the enrollment/data package.
## Requires the OTS ca folder mounted into SWAG at /ots-ca (read-only),
## and SWAG publishing 8443 and 8446.

# 8443 - Marti API, client certificate required
server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate         /ots-ca/certs/opentakserver/opentakserver.pem;
    ssl_certificate_key     /ots-ca/certs/opentakserver/opentakserver.nopass.key;
    ssl_client_certificate  /ots-ca/ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;
    client_max_body_size 100M;

    # No enrollment on this port
    location /Marti/api/tls { return 404; }

    location ~ ^/(Marti|api|files) {
        proxy_pass http://OTS_HOST:7081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ssl-Cert $ssl_client_escaped_cert;
    }
}

# 8446 - certificate enrollment only (username/password, no client cert yet)
server {
    listen 8446 ssl;
    server_name _;

    ssl_certificate     /ots-ca/certs/opentakserver/opentakserver.pem;
    ssl_certificate_key /ots-ca/certs/opentakserver/opentakserver.nopass.key;

    location /Marti/api/tls {
        proxy_pass http://OTS_HOST:7081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /oauth {
        proxy_pass http://OTS_HOST:7081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Ssl-Cert $ssl_client_escaped_cert;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { return 404; }
}
