## SWAG proxy-conf: /config/nginx/proxy-confs/opentakserver.subdomain.conf
## Web UI + WebUI API at https://tak.<your-domain> using SWAG's Let's Encrypt cert.
## Set OTS_HOST to the Docker host's LAN IP (OTS runs with --network=host).
## If SWAG itself runs with --network=host, 127.0.0.1 works.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name tak.*;

    include /config/nginx/ssl.conf;
    client_max_body_size 100M;

    set $ots_upstream http://OTS_HOST:7081;

    # Static OpenTAKServer-UI files (see README step for downloading them)
    root /config/www/opentakserver;
    index index.html;

    # The Marti API is only served on 8443 with client certs
    location /Marti { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        proxy_pass $ots_upstream;
    }

    location /socket.io {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass $ots_upstream;
    }
}
