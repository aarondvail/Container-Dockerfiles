# Included inside http {} via conf.d — temp paths writable by the ots user
client_body_temp_path /tmp/nginx/body;
proxy_temp_path       /tmp/nginx/proxy;
fastcgi_temp_path     /tmp/nginx/fastcgi;
uwsgi_temp_path       /tmp/nginx/uwsgi;
scgi_temp_path        /tmp/nginx/scgi;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- UI: plain HTTP, SWAG terminates TLS in front ----------
server {
    listen 8880;
    root /var/www/html/opentakserver;
    index index.html;
    client_max_body_size 100M;

    location /api/ {
        proxy_pass http://127.0.0.1:7081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:7081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Video for the web UI: MediaMTX in this container (HTTPS with the OTS cert)
    location ~ ^/webrtc(/?)(.*)$ {
        proxy_pass https://127.0.0.1:8889/$2$is_args$args;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/hls(/?)(.*)$ {
        proxy_pass https://127.0.0.1:8888/$2$is_args$args;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------- 8443: Marti API for TAK clients, client cert required ----------
server {
    listen 8443 ssl;
    ssl_crl /home/ots/ots/ca/ca.crl;
    ssl_certificate        /home/ots/ots/ca/certs/opentakserver/opentakserver.pem;
    ssl_certificate_key    /home/ots/ots/ca/certs/opentakserver/opentakserver.nopass.key;
    ssl_client_certificate /home/ots/ots/ca/ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:7081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Ssl-Cert $ssl_client_escaped_cert;
    }
}

# ---------- 8446: certificate enrollment (username/password) ----------
server {
    listen 8446 ssl;
    #ssl_certificate        /home/ots/ots/ca/certs/opentakserver/opentakserver.pem;
    #ssl_certificate_key    /home/ots/ots/ca/certs/opentakserver/opentakserver.nopass.key;
    ssl_certificate     /le/live/vail-industries.com/fullchain.pem;
    ssl_certificate_key /le/live/vail-industries.com/privkey.pem;	
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:7081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
