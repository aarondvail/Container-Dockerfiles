# Add to your existing Mosquitto (e.g. /etc/mosquitto/conf.d/ots-bridge.conf)
connection opentakserver
# Use 127.0.0.1 if your broker runs on the same host as OTS
address OTS_HOST_IP:1884
# An OpenTAKServer user account - RabbitMQ checks these against OTS
remote_username OTS_USER
remote_password OTS_PASSWORD
cleansession true
# Bridge whatever root topic your Meshtastic nodes use (OTS default topic is "opentakserver"); adjust to match
topic opentakserver/# both 0
