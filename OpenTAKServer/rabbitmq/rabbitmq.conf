# 1884 so it does not collide with your own MQTT broker on the host network
mqtt.listeners.tcp.default = 1884

auth_backends.1 = internal
auth_backends.2 = http
auth_http.http_method   = post
auth_http.user_path     = http://127.0.0.1:7081/api/rabbitmq/auth
auth_http.vhost_path    = http://127.0.0.1:7081/api/rabbitmq/vhost
auth_http.resource_path = http://127.0.0.1:7081/api/rabbitmq/resource
auth_http.topic_path    = http://127.0.0.1:7081/api/rabbitmq/topic
