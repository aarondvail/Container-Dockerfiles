## sharebox Torznab API -> SWAG: copy to /config/nginx/proxy-confs/share.subdomain.conf
## Requires SWAG to be attached to the "sharebox" docker network:
##   docker network connect sharebox swag
## Friends' Prowlarr uses https://share.<your domain>/api ; downloads come from /dl/.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name share.*;

    include /config/nginx/ssl.conf;

    location ~ ^/(api|dl/|health) {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app sharebox;
        set $upstream_port 8090;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }

    location / {
        return 404;
    }
}
