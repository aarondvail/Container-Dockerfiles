## sharebox tracker -> SWAG: copy to /config/nginx/proxy-confs/tracker.subdomain.conf
## Requires SWAG to be attached to the "sharebox" docker network:
##   docker network connect sharebox swag
## Only /announce/<key> and /scrape/<key> are exposed; the tracker API (1212) is not.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name tracker.*;

    include /config/nginx/ssl.conf;

    location ~ ^/(announce|scrape)/[A-Za-z0-9]+$ {
        include /config/nginx/resolver.conf;
        set $upstream_app sharebox-tracker;
        set $upstream_port 7070;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # The tracker trusts X-Forwarded-For (on_reverse_proxy = true).
        # Set it to the real client address only, so peers can't spoof it.
        # (Behind Cloudflare, use the CF-Connecting-IP / real_ip module instead.)
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
